server {
    listen 80;
    server_name relay.yanero.top;
    location ^~ /.well-known/acme-challenge/ { root /var/www/codex-relay-acme; }
    location / { return 301 https://relay.yanero.top$request_uri; }
}
server {
    listen 127.0.0.1:9444 ssl;
    server_name relay.yanero.top;
    ssl_certificate /etc/letsencrypt/live/relay.yanero.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay.yanero.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:RelayTLS:1m;
    ssl_session_timeout 1d;
    client_max_body_size 2m;
    client_body_timeout 30s;
    access_log off;
    location / {
        proxy_pass http://127.0.0.1:18021;
        proxy_http_version 1.1;
        proxy_set_header Host relay.yanero.top;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering on;
        proxy_read_timeout 750s;
        proxy_send_timeout 60s;
        proxy_next_upstream off;
    }
}
