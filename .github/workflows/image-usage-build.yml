name: Isolated app-server image usage build
on:
  push:
    branches: [image-usage-app-server]
    paths: ['patches/app-server-image-usage/**', '.github/workflows/image-usage-build.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Download pinned official source and apply patch
        run: |
          set -euo pipefail
          mkdir source artifacts
          curl --fail --location --retry 3 https://github.com/openai/codex/archive/52e73e3a548ae5310c7765995b9803dd538b82b0.tar.gz -o source.tar.gz
          tar -xzf source.tar.gz --strip-components=1 -C source
          cd source
          git init -q
          git add .
          git apply ../patches/app-server-image-usage/image-usage.patch
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: rustfmt,clippy
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            source/codex-rs/target
          key: linux-image-usage-${{ github.run_id }}
          restore-keys: linux-image-usage-
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,cargo-nextest,uv
      - uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config protobuf-compiler libcap-dev clang cmake
      - name: Format
        working-directory: source/codex-rs
        run: just fmt
      - name: Test response parsing and usage serialization
        working-directory: source/codex-rs
        run: |
          just test -p codex-api --lib -E 'test(endpoint::images::tests)'
          just test -p codex-extension-items --lib
      - name: Generate schemas and build app-server
        working-directory: source/codex-rs
        run: |
          export CODEX_APP_SERVER_SCHEMA_ROOT="$PWD/app-server-protocol/schema"
          export CODEX_APP_SERVER_SCHEMA_EXPERIMENTAL=0
          just test -p codex-app-server-protocol --lib --run-ignored only -E 'test(=schema_fixtures_tests::write_schema_fixtures_from_env)'
          export CODEX_APP_SERVER_SCHEMA_EXPERIMENTAL=1
          just test -p codex-app-server-protocol --lib --run-ignored only -E 'test(=schema_fixtures_tests::write_schema_fixtures_from_env)'
          cargo build -p codex-app-server --bin codex-app-server
      - name: Test protocol and image lifecycle
        working-directory: source/codex-rs
        run: |
          just test -p codex-app-server-protocol --lib
          just test -p codex-app-server --test suite -E 'test(v2::imagegen_extension)'
      - name: Package isolated build
        run: |
          cp source/codex-rs/target/debug/codex-app-server artifacts/
          strip artifacts/codex-app-server
          cp -r source/codex-rs/app-server-protocol/schema artifacts/
          git -C source diff > artifacts/complete-source.patch
          sha256sum artifacts/codex-app-server > artifacts/SHA256SUMS
          echo 52e73e3a548ae5310c7765995b9803dd538b82b0 > artifacts/UPSTREAM_COMMIT
      - uses: actions/upload-artifact@v4
        with:
          name: app-server-image-usage-linux-x86_64
          path: artifacts/
          retention-days: 7
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            source/codex-rs/target
          key: linux-image-usage-${{ github.run_id }}
